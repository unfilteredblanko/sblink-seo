[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sblinkseo"
version = "2.9.2"
description = "A complete SEO house with specialist workflows, a backlink source library and its own local crawler."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{name = "SB Link Network"}]
dependencies = ["beautifulsoup4>=4.12,<5", "colorama>=0.4.6,<0.5"]
keywords = ["crawler", "scraper", "seo", "javascript", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
reports = ["reportlab>=4.2,<5"]
sftp = ["paramiko>=3.4,<5"]
dev = ["ruff>=0.11,<1", "reportlab>=4.2,<5", "pypdf>=5,<7"]
hosting-test = ["paramiko>=3.4,<5", "pyftpdlib>=2,<3", "pyOpenSSL>=24,<27"]

[project.scripts]
sblinkseo = "sblinkseo.cli:main"

[project.urls]
Author = "https://github.com/unfilteredblanko"
Repository = "https://github.com/unfilteredblanko/sblink-seo"
Documentation = "https://github.com/unfilteredblanko/sblink-seo/blob/main/docs/README.md"
Issues = "https://github.com/unfilteredblanko/sblink-seo/issues"
Changelog = "https://github.com/unfilteredblanko/sblink-seo/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sblinkseo = ["report_assets/*.png", "report_assets/*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
